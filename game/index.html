<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Волшебные шахматы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@700&family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&display=block&text=%E2%99%9A%E2%99%9B%E2%99%9C%E2%99%9D%E2%99%9E%E2%99%9F">
<style>
:root{
  --bg:#2A1F4E; --bg2:#3A2C66; --ink:#FFF7EC; --muted:#D3C8F2;
  --light:#FFF1DA; --dark:#B89AE6; --frame:#6A45A3; --frame2:#46297A;
  --accent:#FFC83D; --accent-sh:#C98F12; --hint:#FF5C8A; --piece-w:#FFFBF0; --piece-line:#2A1F4E; --piece-b:#2A2336;
  --board: clamp(250px, min(calc(100vw - 32px), calc(100dvh - 270px)), 460px);
  --n: 6;
  --cell: calc(var(--board) / var(--n));
  color-scheme: dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:
    radial-gradient(circle at 15% 10%, rgba(255,200,61,.10), transparent 40%),
    radial-gradient(circle at 90% 85%, rgba(255,120,190,.16), transparent 45%),
    var(--bg);
  color:var(--ink); font-family:"Nunito", system-ui, sans-serif; font-weight:800;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  overflow-x:hidden;
}
.g{font-family:"Noto Sans Symbols 2","Segoe UI Symbol","DejaVu Sans",serif; font-weight:400; line-height:1}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
button:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
#app{min-height:100%; display:flex; flex-direction:column; align-items:center; gap:12px; padding:12px 16px 20px; box-sizing:border-box; max-width:520px; margin:0 auto}

/* top bar */
.top{width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px}
.chips{display:flex; gap:4px; flex:1; min-width:0; align-items:center}
.seg{flex:1; height:10px; border-radius:6px; background:var(--bg2); border:1px solid rgba(255,255,255,.14); max-width:34px}
.seg.done{background:var(--accent); border-color:var(--accent)}
.seg.now{background:rgba(255,200,61,.35); border-color:var(--accent)}
.partlbl{font-family:"Balsamiq Sans","Nunito",sans-serif; font-size:15px; color:var(--muted); margin-right:6px; white-space:nowrap}
.chip{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--bg2); border:2px solid rgba(255,255,255,.12); font-size:24px; color:var(--muted)}
.chip .g{font-size:21px; color:inherit}
.chip.now{border-color:var(--accent); color:var(--ink); box-shadow:0 0 0 3px rgba(255,200,61,.25)}
.chip.done{background:var(--accent); color:#3A2A05; border-color:var(--accent)}
.chip.q{font-family:"Balsamiq Sans","Nunito",sans-serif; font-size:20px}
.tools{display:flex; gap:6px}
.iconbtn{width:40px; height:40px; border-radius:12px; background:var(--bg2); display:grid; place-items:center; border:2px solid rgba(255,255,255,.12)}
.iconbtn svg{width:22px; height:22px; stroke:var(--ink); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.iconbtn.off svg .wave{display:none}
.iconbtn.off svg .x{display:inline}
.iconbtn svg .x{display:none}

/* narrator */
.bubble{width:100%; display:flex; align-items:flex-end; gap:10px}
.rex{font-size:52px; line-height:1; flex:none; transform-origin:50% 100%; animation:bob 2.4s ease-in-out infinite}
.rex.talk{animation:talk .35s ease-in-out 4}
.say{flex:1; position:relative; background:var(--ink); color:#2A1F4E; border-radius:18px; padding:12px 44px 12px 14px; font-size:clamp(16px, 4.4vw, 19px); line-height:1.3; min-height:48px; display:flex; align-items:center; text-align:left}
.say::before{content:""; position:absolute; left:-9px; bottom:14px; border:10px solid transparent; border-right-color:var(--ink); border-left:0}
.say .rep{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; background:#E9DDB2; display:grid; place-items:center}
.say .rep svg{width:18px; height:18px; stroke:#2A1F4E; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}

/* board */
.frame{padding:9px; background:linear-gradient(var(--frame), var(--frame2)); border-radius:18px; box-shadow:0 8px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.18)}
.board{position:relative; width:var(--board); height:var(--board); border-radius:10px; overflow:hidden}
.cells{position:absolute; inset:0; display:grid; grid-template-columns:repeat(var(--n),1fr); grid-template-rows:repeat(var(--n),1fr)}
.cell{position:relative; background:var(--light); padding:0; border-radius:0}
.cell.dk{background:var(--dark)}
.cell.goal{box-shadow:inset 0 0 0 3px rgba(255,200,61,.8)}
.cell.danger::before{content:""; position:absolute; inset:0; background:rgba(235,60,60,.38); pointer-events:none}
.cell.check::before{content:""; position:absolute; inset:0; background:radial-gradient(circle, rgba(255,40,40,.85) 0%, rgba(255,40,40,.35) 55%, transparent 75%); pointer-events:none}
.cell.sel::before{content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 4px var(--accent); background:rgba(255,200,61,.25); pointer-events:none}
.cell.legal.castle::after{width:52%; height:52%; background:var(--accent); box-shadow:0 0 0 3px #fff, 0 0 12px 4px rgba(255,200,61,.8)}
.cell.legal::after{content:""; position:absolute; left:50%; top:50%; width:30%; height:30%; transform:translate(-50%,-50%); border-radius:50%; background:var(--hint); box-shadow:0 0 0 3px #fff; animation:pulse 1.3s ease-in-out infinite; z-index:3; pointer-events:none}
.cell.legal.cap::after{width:84%; height:84%; background:transparent; box-shadow:inset 0 0 0 5px var(--hint), 0 0 0 2px #fff}
.layer{position:absolute; inset:0; pointer-events:none}
.tok{position:absolute; left:0; top:0; width:calc(100% / var(--n)); height:calc(100% / var(--n)); display:grid; place-items:center; transition:transform .42s cubic-bezier(.3,.8,.3,1.1)}
.tok .g{font-size:calc(var(--cell) * .8)}
.tok.w .g{color:var(--piece-w); -webkit-text-stroke:calc(var(--cell) * .035) var(--piece-line); paint-order:stroke fill; filter:drop-shadow(0 3px 0 rgba(0,0,0,.28))}
.tok.b .g{color:var(--piece-b); -webkit-text-stroke:1px rgba(255,255,255,.35); paint-order:stroke fill; filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.tok.hero{z-index:2}
.tok .g.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; -webkit-text-stroke:0; font-size:calc(var(--cell) * .64); filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.foes{display:flex; flex-direction:column; gap:8px; width:100%}
.foe{display:flex; align-items:center; gap:10px; background:#EFE6FF; border-radius:16px; padding:8px 12px; box-shadow:0 4px 0 #BBA8E6; text-align:left; color:#2A1F4E}
.foe .em{font-size:34px}
.foe .nm{flex:1; font-size:17px; font-weight:900; line-height:1.15}
.foe .st{font-size:13px; color:#B8860B; letter-spacing:1px}
.opts{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.opt{padding:8px 14px; border-radius:999px; background:#EFE6FF; color:#2A1F4E; font-weight:900; font-size:15px; box-shadow:0 3px 0 #BBA8E6}
.opt.on{background:var(--accent); box-shadow:0 3px 0 var(--accent-sh)}
.tok.hero .g{display:block; animation:bob 1.8s ease-in-out infinite}
.tok.item{font-size:calc(var(--cell) * .58); line-height:1}
.tok.item span{display:block; animation:wiggle 2.2s ease-in-out infinite}
.tok.gone{animation:pop .55s ease-out forwards}
.tok.shake .g{animation:shake .4s}
.tok.baby span{animation:none}

.counter .tag{font-size:16px; font-family:"Balsamiq Sans","Nunito",sans-serif; background:var(--bg2); border:2px solid var(--accent); color:var(--ink); padding:4px 14px; border-radius:999px}
.counter{display:flex; gap:10px; min-height:40px; align-items:center; justify-content:center; font-size:30px}
.counter span{transition:opacity .3s, transform .3s}
.counter .off{opacity:.25; transform:scale(.8)}

/* overlay */
.overlay{position:fixed; inset:0; background:rgba(24,14,48,.74); display:grid; place-items:center; padding:16px; z-index:20; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
.card{width:100%; max-width:400px; background:var(--ink); color:#2A1F4E; border-radius:26px; padding:24px 20px 22px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; box-shadow:0 10px 0 rgba(0,0,0,.25); animation:rise .35s ease-out; box-sizing:border-box; max-height:calc(100dvh - 32px); overflow:auto}
.card h1,.card h2{font-family:"Balsamiq Sans","Nunito",sans-serif; margin:0; line-height:1.1; text-wrap:balance}
.card h1{font-size:clamp(34px, 10vw, 44px); color:#6B36B8}
.card h2{font-size:32px; color:#6B36B8}
.card p{margin:0; font-size:18px; line-height:1.35; max-width:32ch; text-wrap:pretty}
.card .small{font-size:14px; font-weight:700; color:#6B6385; line-height:1.4}
.bigpiece{font-size:110px; color:var(--piece-w); -webkit-text-stroke:4px var(--piece-line); paint-order:stroke fill; animation:bob 1.8s ease-in-out infinite; filter:drop-shadow(0 5px 0 rgba(0,0,0,.2))}
.row{display:flex; gap:6px; justify-content:center; align-items:flex-end; flex-wrap:wrap}
.row .g{font-size:48px; color:var(--piece-w); -webkit-text-stroke:2.5px var(--piece-line); paint-order:stroke fill}
.row .dino{font-size:44px}
.cta{background:var(--accent); color:#3A2A05; font-size:22px; font-weight:900; padding:14px 34px; border-radius:999px; box-shadow:0 6px 0 var(--accent-sh); transition:transform .1s, box-shadow .1s; margin-top:4px}
.cta.alt{background:#E9DDB2; box-shadow:0 6px 0 #BFAE77; font-size:19px}
.parts{display:flex; flex-direction:column; gap:14px; width:100%; align-items:stretch}
.parts .cta{display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.15}
.parts .cta small{font-size:14px; font-weight:800; opacity:.75}
.cta:active{transform:translateY(4px); box-shadow:0 2px 0 var(--accent-sh)}
.quizgrid{display:grid; grid-template-columns:repeat(var(--qn,5), 1fr); gap:6px; width:100%}
.qbtn{aspect-ratio:1; border-radius:16px; background:var(--dark); display:grid; place-items:center; box-shadow:0 5px 0 #8D6CC4}
.qbtn:nth-child(odd){background:#E9DDB2; box-shadow:0 5px 0 #BFAE77}
.qbtn .g{font-size:min(13vw, 56px); color:var(--piece-w); -webkit-text-stroke:2.5px var(--piece-line); paint-order:stroke fill}
.qbtn.yes{background:var(--accent); box-shadow:0 5px 0 var(--accent-sh)}
.qbtn.no{animation:shake .4s}
.fb{min-height:26px; font-size:17px; color:#6B36B8}
.stars{font-size:28px; letter-spacing:2px}

canvas#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:30}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
@keyframes talk{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(-6deg) scale(1.08)}}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(.8)}}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes pop{0%{opacity:1}40%{opacity:1; scale:1.5}100%{opacity:0; scale:.2}}
@keyframes shake{0%,100%{translate:0}20%{translate:-10%}40%{translate:10%}60%{translate:-7%}80%{translate:7%}}
@keyframes rise{from{transform:translateY(24px) scale(.96); opacity:0}to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important}
  .tok{transition-duration:.12s}
}
</style>
</head>
<body>


<div id="app">
  <header class="top">
    <div class="chips" id="chips"></div>
    <div class="tools">
      <button class="iconbtn" id="btnHome" aria-label="На главный экран">
        <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>
      </button>
      <button class="iconbtn" id="btnSound" aria-label="Выключить звук">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg>
      </button>
      <button class="iconbtn" id="btnRestart" aria-label="Начать задание заново">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
      </button>
    </div>
  </header>

  <div class="bubble">
    <div class="rex" id="rex" aria-hidden="true">🐉</div>
    <div class="say"><span id="task">Привет! Я дракончик Искра.</span>
      <button class="rep" id="btnRepeat" aria-label="Повторить задание"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7"/></svg></button>
    </div>
  </div>

  <div class="frame"><div class="board" id="board"><div class="cells" id="cells"></div><div class="layer" id="layer"></div></div></div>
  <div class="counter" id="counter" aria-live="polite"></div>
</div>

<div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
<canvas id="fx"></canvas>

<script>window.DINO_CLIPS={};</script>
<script>
(function(){
const VS='︎';
const GLYPH={king:'♚', queen:'♛', rook:'♜', bishop:'♝', knight:'♞', pawn:'♟'};
const NAME={king:'Король', queen:'Ферзь', rook:'Ладья', bishop:'Слон', knight:'Конь', pawn:'Пешка'};
const RULE={
  king:'Король ходит на одну клетку в любую сторону.',
  rook:'Ладья ходит только прямо: вверх, вниз, влево или вправо.',
  bishop:'Слон ходит только наискосок, по диагонали.',
  queen:'Ферзь ходит и прямо, и наискосок. Но перепрыгивать через фигуры не умеет.',
  knight:'Конь ходит буквой «Г»: две клетки прямо и одну вбок.',
  pawn:'Пешка ходит только вперёд, а ест наискосок.'
};
const RIGHT={king:'Правильно! Это король.', rook:'Правильно! Это ладья.', bishop:'Правильно! Это слон.', queen:'Правильно! Это ферзь.', knight:'Правильно! Это конь.', pawn:'Правильно! Это пешка.'};
const WRONG={king:'Это король. Попробуй ещё!', rook:'Это ладья. Попробуй ещё!', bishop:'Это слон. Попробуй ещё!', queen:'Это ферзь. Попробуй ещё!', knight:'Это конь. Попробуй ещё!', pawn:'Это пешка. Попробуй ещё!'};
const PROMO={queen:'Ферзь! Самый сильный выбор.', rook:'Ладья! Хороший выбор.', bishop:'Слон! Тоже можно.', knight:'Конь! Прыгучий выбор.'};
const S_BLACK='Это чёрная фигура. Мы играем белыми.';
const S_DANGER='Туда нельзя, там опасно! Король попадёт под удар.';
const S_NOMOVE='Этой фигуре сейчас некуда ходить.';
const S_NOTMATE='Это ещё не мат: королю есть куда убежать. Попробуй другой ход.';
const S_LOSE='Чёрные в этот раз оказались быстрее. Попробуем ещё раз!';
const S_STUCK='Эта пешка упёрлась. Прямо пешка не ест!';
const S_DRAW='Ничья! Никто не может ходить. Сыграем ещё раз!';
const S_BPASS='Чёрным некуда ходить. Ходи ещё раз!';
const S_WPASS='Тебе некуда ходить. Чёрные ходят ещё раз.';
const S_NOTCASTLE='Это обычный ход. Попробуй рокировку: король шагает на две клетки к ладье.';

/* ---------- random position helpers ---------- */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const nm=(c,r,n)=>String.fromCharCode(97+c)+(n-r);
function freeSquares(n,taken,filter){ const out=[]; for(let r=0;r<n;r++) for(let c=0;c<n;c++){ const k=c+','+r; if(!taken.has(k)&&(!filter||filter(c,r))) out.push([c,r]); } return out; }
function takeRandom(n,count,taken,filter){ const res=[]; for(let i=0;i<count;i++){ const f=freeSquares(n,taken,filter); if(!f.length) break; const [c,r]=pick(f); taken.add(c+','+r); res.push(nm(c,r,n)); } return res; }

const PARTS=[
 { title:'Часть 1', name:'Знакомство с фигурами', finalTitle:'Шахматист!', levels:[
  { N:6, lock:true, item:'🥚', after:'🐣', goal:'items', slideCollect:true, sym:'none',
    gen(){ const t=new Set(), hc=rnd(6); t.add(hc+',5'); return {hero:nm(hc,5,6), w:{rook:[nm(hc,5,6)]}, items:takeRandom(6,3,t,(c,r)=>c!==hc&&r!==5)}; },
    intro:'Это ладья. Она похожа на башню. Ладья ходит прямо: вверх, вниз, вправо и влево. Хоть на сколько клеток!',
    task:'Собери ладьёй яйца дракончиков! Нажимай на розовые кружочки.',
    win:'Ура! Все яйца нашлись, и из них вылупились дракончики!', pic:'🐣🐉🐣' },
  { N:6, lock:true, item:'🍎', after:'💜', goal:'items', slideCollect:true, sym:'none',
    gen(){ const t=new Set(), hc=rnd(6), col=(hc+5)%2; t.add(hc+',5'); return {hero:nm(hc,5,6), w:{bishop:[nm(hc,5,6)]}, items:takeRandom(6,3,t,(c,r)=>(c+r)%2===col&&r<5)}; },
    intro:'Это слон. Слон ходит наискосок, вот так, по диагонали.',
    task:'Единорог проголодался. Собери слоном все яблочки!',
    win:'Молодец! Посмотри: слон всегда ходит по клеткам одного цвета.', pic:'🦄💜' },
  { N:6, lock:true, goal:'capture', sym:'none',
    gen(){ const t=new Set(), hc=rnd(6); t.add(hc+',5'); return {hero:nm(hc,5,6), w:{queen:[nm(hc,5,6)]}, b:{pawn:takeRandom(6,4,t,(c,r)=>r>=1&&r<=4)}}; },
    intro:'Это ферзь, самая сильная фигура. Ферзь ходит и прямо, как ладья, и наискосок, как слон.',
    task:'Съешь ферзём чёрные пешки: просто встань на их клетку!',
    win:'Ура! Ферзь съел все чёрные пешки. Дракончики спасены!', pic:'🐉✨' },
  { N:6, lock:true, item:'🦄', after:'💖', goal:'items', sym:'none',
    gen(){ const t=new Set(), hc=1+rnd(4); t.add(hc+',5'); const fr=[hc-1,hc,hc+1].map(c=>{ t.add(c+',4'); return nm(c,4,6); });
      return {hero:nm(hc,5,6), w:{knight:[nm(hc,5,6)], pawn:fr}, items:takeRandom(6,3,t,(c,r)=>r<4)}; },
    intro:'Это конь. Он ходит буквой «Г» и умеет перепрыгивать через другие фигуры!',
    task:'Конь скачет в гости к единорогам. Навести всех!',
    win:'Отлично! Конь навестил всех единорогов!', pic:'🦄💖🦄' },
  { N:6, lock:true, item:'👑', decor:true, goal:'promote', sym:'none',
    gen(){ const x=rnd(6), s=x===0?1:x===5?-1:pick([-1,1]); return {hero:nm(x,4,6), w:{pawn:[nm(x,4,6)]}, b:{pawn:[nm(x,1,6),nm(x+s,1,6)]}, items:[nm(x+s,0,6)]}; },
    intro:'Это пешка. Она маленькая, но смелая. Пешка ходит только вперёд на одну клетку, а в первый раз может шагнуть на две!',
    task:'Доведи пешку до короны на самом верху доски.',
    win:'Чудо! Пешка дошла до конца доски и превратилась в ферзя!', pic:'👑' }
 ], quiz:[
  {q:'Где конь? Он ходит буквой «Г».', a:'knight'},
  {q:'Покажи ладью. Она похожа на башню.', a:'rook'},
  {q:'Какая фигура самая сильная?', a:'queen'},
  {q:'Кто ходит только вперёд?', a:'pawn'},
  {q:'Кто ходит только наискосок?', a:'bishop'}
 ], quizSet:['rook','bishop','queen','knight','pawn'],

/* ---------- random variants ---------- */
const SYMS=[(c,r,n)=>[c,r],(c,r,n)=>[n-1-c,r],(c,r,n)=>[c,n-1-r],(c,r,n)=>[n-1-c,n-1-r],(c,r,n)=>[r,c],(c,r,n)=>[n-1-r,c],(c,r,n)=>[r,n-1-c],(c,r,n)=>[n-1-r,n-1-c]];
function instLevel(base){
  let C=Object.assign({},base);
  if(base.variants) Object.assign(C,pick(base.variants));
  if(base.gen) Object.assign(C,base.gen());
  const n=C.N, sym=C.sym||'mirror';
  const t=sym==='d4'?pick(SYMS):sym==='mirror'?pick([SYMS[0],SYMS[1]]):SYMS[0];
  const T=s=>{ if(typeof s!=='string'||!/^[a-h][1-8]$/.test(s)) return s; const c=s.charCodeAt(0)-97, r=n-parseInt(s.slice(1),10); const [c2,r2]=t(c,r,n); return String.fromCharCode(97+c2)+(n-r2); };
  const TS=o=>{ if(!o) return o; const out={}; Object.entries(o).forEach(([k,v])=>out[k]=v.map(T)); return out; };
  C.hero=T(C.hero); C.w=TS(C.w); C.b=TS(C.b);
  ['items','reply','pre'].forEach(k=>{ if(C[k]) C[k]=C[k].map(T); });
  if(C.target&&/^[a-h][1-8]$/.test(C.target)) C.target=T(C.target);

function isPassed(p){ return p.type==='pawn'&&!pieces.some(q=>q.alive&&q.color!==p.color&&q.type==='pawn'&&Math.abs(q.c-p.c)<=1&&(p.color==='w'?q.r<p.r:q.r>p.r)); }

  const p=m.p, g=L.goal;
  if(g==='check') return inCheck('b');
  if(g==='castle') return !!(m.castle&&(!L.side||m.side===L.side));
  if(g==='mate') return isMate('b');
  if(g==='safeCapture') return !!(m.cap&&!attacked(p.c,p.r,'b'));
  if(g==='safeAll') return !pieces.some(q=>q.alive&&q.color==='w'&&attacked(q.c,q.r,'b'));
  if(g==='captureType') return !!(m.cap&&m.cap.type===L.target);
  if(g==='defend'){ const [tc,tr]=sq(L.target), t=at(tc,tr); return !!(t&&t.color==='w'&&attacked(tc,tr,'w')); }
  if(g==='ep') return !!m.ep;
  if(g==='fork'){ const tg=(L.targets||['king','rook']).map(t=>pieces.find(q=>q.alive&&q.color==='b'&&q.type===t)); const a=attacks(p); const hit=q=>q&&a.some(([c,r])=>c===q.c&&r===q.r); return p.type===(L.forker||'knight')&&tg.every(hit); }

  if(o&&o===sel){ say(o.type==='pawn'&&!moves.length&&at(o.c,o.r-1)?S_STUCK:RULE[o.type]); return; }

    if(L.lock){ say(L.w.knight?'Это наша пешка. А конь умеет через неё перепрыгнуть!':'Это наша пешка.'); return; }

  else if(o&&o.color==='b'&&o.type==='king') say('Короля съесть нельзя. Ему можно только поставить шах или мат.');

function showQuiz(k){
  st.screen='quiz'; renderChips();
  const P=PARTS[st.part], Q=P.quiz[k], order=shuffle(P.quizSet);
  card.style.setProperty('--qn', order.length>5?3:order.length);
  openCard(`<div class="small">Вопрос ${k+1} из ${P.quiz.length}</div><div class="rex" style="font-size:48px">🐉</div>
    <h2 style="font-size:26px">${Q.q}</h2>
    <div class="quizgrid">${order.map(t=>`<button class="qbtn" data-t="${t}" aria-label="${NAME[t]}"><span class="g">${GLYPH[t]+VS}</span></button>`).join('')}</div>
    <div class="fb" id="fb"></div>`);
  taskEl.textContent=Q.q; say(Q.q,false);
  let lock=false;
  card.querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>{
    if(lock) return; unlock(); const t=b.dataset.t;
    if(t===Q.a){ lock=true; b.classList.add('yes'); sfx.collect(); $('fb').textContent=RIGHT[t]; say(RIGHT[t],false);
      setTimeout(()=>{ if(k+1<P.quiz.length) showQuiz(k+1); else { done[st.part][P.levels.length]=true; saveDone(); showFinal(); } }, 1700); }
    else { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); sfx.wrong(); $('fb').textContent=WRONG[t]; say(WRONG[t],false); }
  });
}
function showFinal(){
  st.screen='final'; renderChips(); sfx.win(); confetti();
  const P=PARTS[st.part], txt=P.final, set=st.part===0?['rook','bishop','queen','knight','pawn']:st.part===1?['king','queen','rook','bishop','knight','pawn']:['pawn','pawn','pawn','pawn'];
  openCard(`<div class="row"><span class="dino">🦄</span>${set.map(t=>`<span class="g">${GLYPH[t]+VS}</span>`).join('')}<span class="dino">🐉</span></div>
    <h1>${P.finalTitle}</h1><p>${txt}</p>
    <div class="parts">
      ${st.part<PARTS.length-1?`<button class="cta" id="next">${PARTS[st.part+1].title}: ${PARTS[st.part+1].name.toLowerCase()}</button>`:''}
      <button class="cta alt" id="home">На главный экран</button>
    </div>`);
  taskEl.textContent='Ты молодец!'; say(txt,false);
  if($('next')) $('next').onclick=()=>startPart(st.part+1);
  $('home').onclick=showStart;
}

/* ---------- controls ---------- */
$('btnRepeat').onclick=()=>{ unlock(); if(st.screen==='play') say(st.stage===1&&L.task2?L.task2:L.task); else say(taskEl.textContent,false); };
$('btnRestart').onclick=()=>{ if(st.screen!=='play'||(busy&&!L.ai)) return; loadLevel(); startPlay(); };
$('btnHome').onclick=()=>{ if(aiTimer){ clearTimeout(aiTimer); aiTimer=null; } try{voice.pause();}catch(e){} showStart(); };
$('btnSound').onclick=()=>{ muted=!muted; if(muted){ try{voice.pause();}catch(e){} if(canSpeak) try{speechSynthesis.cancel();}catch(e){} } $('btnSound').classList.toggle('off',muted); $('btnSound').setAttribute('aria-label',muted?'Включить звук':'Выключить звук'); };


showStart();
})();
</script>
